# robot_localization çift-UKF füzyon konfigürasyonu
# Config vektörü (15): [x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az]
#
# ukf_local  : odom->base_link  (sürekli, pürüzsüz) — teker odom + ZED IMU, GPS YOK
# ukf_global : map->odom         (mutlak, drift düzeltmeli) — + /odometry/gps
# navsat_transform : GPS -> map frame odometry (UTM içeride, pyproj gerekmez)

# ============================================================================
ukf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Teker odometrisi -> vx (6) + vyaw (11)
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ZED2 IMU -> vyaw (11) + ax (12); absolute orientation KULLANMA
    imu0: /zed/zed_node/imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

# ============================================================================
ukf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Teker odometrisi -> vx + vyaw
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # ZED2 IMU -> vyaw + ax
    imu0: /zed/zed_node/imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    # navsat_transform çıktısı (GPS map konumu) -> x (0) + y (1)
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 10

# ============================================================================
navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    # 2026-07-24: NOAA/NCEI WMM-2025 modelinden, sahadan verilen gercek
    # koordinat (40.789983 K, 29.5087905 D) ve bugunun tarihiyle (2026-07-24)
    # HESAPLANDI: declination = 6.07631 derece = 0.10605 rad. (Onceki tahmini
    # deger 0.09 rad/~5.2 dereceydi - gercek deger 6.08 derece cikti.)
    # Not: sapma konuma gore COK yavas degistigi icin sahanin herhangi bir
    # noktasindan alinan koordinat bu hesap icin yeterlidir (birkac 10 m fark
    # etmez); ama yil degisirse (manyetik kutup kayar) yeniden hesaplanmali.
    # !!! 2026-07-28 SAHA BULGUSU - DEGISTIRMEDEN ONCE OKUYUN !!!
    # Bu blok ZED IMU'sunu (imu0: /zed/zed_node/imu/data) kullaniyor, ama
    # aractaki IYI yon kaynagi XSENS: /filter/quaternion. Bag olcumu:
    #   * Xsens quaternion yaw, arac dururken sd 0.03-0.15 derece (cok kararli)
    #   * duz surusde GPS izine gore sapma +4.80 (duz_0727_1152, 55.7 m,
    #     duzluk 0.29 m) ve +1.68 derece (duzters_0727_1758, ters yon, 71.4 m,
    #     duzluk 1.67 m) -> en iyi tahmin +3.2 derece, belirsizlik +-1.6 derece.
    #     Iki yonun farkli cikmasi duzters kaydinin daha az duz olmasindan;
    #     yon-bagimli bir hata OLDUGU KANITLANMADI.
    #   * MANYETOMETRE (/imu/mag) KULLANILAMAZ: yatay bilesen buyuklugu iki
    #     kayit arasinda 0.5446 -> 0.4293 (%27) degisiyor; homojen alanda
    #     SABIT olmaliydi -> guclu hard-iron bozulmasi (arac govdesi/motor).
    #     Manyetik yon 24.5 derece tutarsizlik veriyor. Bu yuzden manyetometreye
    #     dayali her turlu yon duzeltmesi (declination dahil) SUPHELIDIR.
    #
    # Asagidaki declination degeri ZED IMU'su icin GECERLI OLUP OLMADIGI
    # DOGRULANMADI - benim olcumlerim Xsens'e ait. Sahada tek testle
    # netlesir: araci bilinen bir yonde duz surup /odometry/filtered_map
    # yaw'ini GPS iz acisiyla karsilastirin. Fark ~6 derece ise declination
    # cift uygulaniyor demektir, 0.0 yapin.
    magnetic_declination_radians: 0.10605
    yaw_offset: 0.0                      # IMU 0'ı doğu ise ayarla
    zero_altitude: true
    broadcast_utm_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false              # ZED heading güvenilmezse true + GPS hareket
    wait_for_datum: false
